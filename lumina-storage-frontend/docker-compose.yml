services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_PREFIX: ${VITE_API_PREFIX:-http://localhost:1690/api/v1}
        VITE_SSO_SERVICE_URL: ${VITE_SSO_SERVICE_URL:-http://localhost:3100}
        VITE_SSO_AUTO_REDIRECT: ${VITE_SSO_AUTO_REDIRECT:-false}
        VITE_SSO_APP: ${VITE_SSO_APP:-storage}
        VITE_ENTRA_STORAGE_FE_CLIENT_ID: ${VITE_ENTRA_STORAGE_FE_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-common}
        VITE_ENTRA_STORAGE_API_SCOPE: ${VITE_ENTRA_STORAGE_API_SCOPE:-}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-http://localhost:5174/auth/microsoft/popup}
        VITE_CORE_ORIGIN: ${VITE_CORE_ORIGIN:-http://localhost:5173}
    container_name: lumina-driver-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
