[project]
name = "lumina-driver-backend"
version = "0.1.0"
description = "Lumina Driver Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "arq>=0.25.0",
    "redis>=5.0.0",
    "litellm>=1.50.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "qdrant-client>=1.9.0",
    "boto3>=1.35.0",
    "gdown>=5.0.0",
    "pymupdf>=1.24.0",
    "markitdown[docx,image,pdf,pptx,xlsx]>=0.0.1",
    "python-pptx>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "pptx2md>=2.0.6",
    "langchain-experimental>=0.4.1",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0,<4.0.0",
    "tabulate>=0.10.0",
    "python-frontmatter>=1.0.0",
    "python-docx>=1.0.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "python-magic>=0.4.27",
    "underthesea>=6.8.0",
    "htmldocx>=0.0.6",
    "beautifulsoup4>=4.12.0",
    "bleach>=6.0.0",
    "structlog>=24.1.0",
    "asgi-correlation-id>=4.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "fakeredis>=2.23.0",
    "httpx>=0.27.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
